name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: internship_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d internship_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values; none of these are real secrets.
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/internship_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/internship_tracker_test
      JWT_SECRET: ci-test-only-jwt-secret-not-a-real-secret-0123456789abcdef
      # Valid Fernet key (32 url-safe base64 bytes), generated for CI use only.
      TOKEN_ENCRYPTION_KEY: ABq5Suzsc4_drcqfJe-4EkCP5_VE9Qud2EdPzorSPOk=
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      GOOGLE_CLIENT_SECRET: ci-test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:5173/api/docs/google/callback
      COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run pytest
        run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Run tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
