[pytest]
filterwarnings =
    error
    # Starlette's TestClient emits this on every import, nudging users toward
    # a new `httpx2` package. We stay on `httpx` per the project's pinned
    # dependency set (requirements.txt) until that ecosystem stabilizes.
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning
    # passlib imports the stdlib `crypt` module, deprecated since Python 3.12.
    # Third-party import-time warning; passlib is pinned in requirements.txt.
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
