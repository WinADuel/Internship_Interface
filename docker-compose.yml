services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published ports: only the backend reaches the db over the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # Nightly full re-sync of the backup Google Sheet (spec §13.7), at 03:00 in TZ.
  sheet-sync:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    command: python -m app.jobs.nightly_sheet_sync
    depends_on:
      - db

  # Job discovery scans (Phase 2 spec §5): every discovery_scan_hours hours.
  job-scan:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    command: python -m app.jobs.job_scan
    depends_on:
      - db

  caddy:
    build: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
